openapi: 3.1.0
info:
  title: CoursesList API
  version: "1.0.0"
  summary: API systemu obsługi szkoleń — kursy, kursanci, firmy, zaświadczenia, dzienniki szkoleń.
  description: |
    Specyfikacja dla aplikacji integrujących się z API serwer-serwer za pomocą klucza API.

    **Przeczytaj najpierw `INTEGRATION.md`** z tego samego katalogu — opisuje reguły, których
    nie da się wyrazić w samym schemacie (semantyka PATCH jako pełnego nadpisania, formaty dat
    bez strefy czasowej, niespójności nazw pól, pułapki przy tworzeniu zaświadczeń).

    Konwencje:
    - Każda udana odpowiedź JSON ma kopertę `{"data": ...}`; błędy mają `{"error": {"code", "message"}}`.
    - Każda operacja wymaga zakresu podanego w `x-required-scope` (brak = wystarczy ważny klucz).
    - Operacje z `x-requires-admin: true` wymagają dodatkowo, by konto serwisowe klucza miało rolę
      administratora (`role = 1`) — sam zakres nie wystarczy.
    - Ciała żądań są odrzucane (400), jeśli zawierają pole spoza schematu.

    Wygenerowano z kodu źródłowego (`api/internal/*`) na gałęzi `api_and_webhook`.
servers:
  - url: "{baseUrl}/api/v1"
    variables:
      baseUrl:
        default: http://localhost:8081
        description: >-
          Adres Go API. Lokalnie `http://localhost:8081`; w `docker-compose.prod.yml` API nasłuchuje na
          porcie 8082. Integracje powinny wołać Go API bezpośrednio, nie przez proxy Nuxt.
security:
  - apiKey: []
tags:
  - name: system
  - name: auth
  - name: students
    description: Kursanci
  - name: companies
    description: Firmy (pracodawcy kursantów)
  - name: courses
    description: Kursy i ich szablony zaświadczeń
  - name: certificates
    description: Zaświadczenia ukończenia szkolenia
  - name: registries
    description: Numeracja rejestru zaświadczeń
  - name: journals
    description: Dzienniki szkoleń (sesje, uczestnicy, obecność, skany)
  - name: dashboard
  - name: admin
    description: Zarządzanie użytkownikami — wymaga konta administratora
  - name: audit
    description: Historia zmian — wymaga konta administratora

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Sprawdzenie dostępności API
      security: []
      responses:
        "200":
          description: API działa.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /auth/me:
    get:
      tags: [auth]
      operationId: getCurrentAccount
      summary: Konto, w imieniu którego działa klucz
      description: >-
        Nie wymaga żadnego zakresu. Użyj do sprawdzenia, czy klucz jest ważny i do jakiego konta
        serwisowego jest przypisany. Nie zwraca listy zakresów klucza.
      responses:
        "200":
          description: Konto serwisowe klucza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- students
  /students:
    get:
      tags: [students]
      operationId: listStudents
      summary: Lista kursantów
      description: >-
        Sortowanie: nazwisko, imię. `search` dzieli frazę na słowa (po spacjach i przecinkach);
        kursant pasuje, gdy **każde** słowo występuje w imieniu, nazwisku lub PESEL-u
        (bez rozróżniania wielkości liter, dopasowanie fragmentu).
      x-required-scope: students:read
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - name: companyId
          in: query
          description: Tylko kursanci przypisani do tej firmy.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Kursanci.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [students]
      operationId: createStudent
      summary: Utworzenie kursanta
      x-required-scope: students:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentWrite"
      responses:
        "201":
          description: Utworzony kursant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: >-
            Także gdy `companyId` wskazuje nieistniejącą firmę — API nie rozróżnia tego przypadku
            (`failed to create student`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /students/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [students]
      operationId: getStudent
      summary: Szczegóły kursanta
      x-required-scope: students:read
      responses:
        "200":
          description: Kursant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [students]
      operationId: replaceStudent
      summary: Aktualizacja kursanta (pełne nadpisanie)
      description: >-
        **Mimo metody PATCH to pełne nadpisanie.** Pominięte pola opcjonalne (`pesel`, `secondName`,
        adres, `telephone`, `companyId`) zostaną ustawione na `null`. Zawsze wysyłaj komplet danych —
        najpierw pobierz kursanta przez GET.
      x-required-scope: students:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentWrite"
      responses:
        "200":
          description: Kursant po zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /students/{id}/certificates:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [students, certificates]
      operationId: listStudentCertificates
      summary: Zaświadczenia kursanta
      description: >-
        Bez paginacji, sortowanie: data wystawienia malejąco. Pomija zaświadczenia usunięte.
        Nieistniejący kursant daje pustą listę, nie 404. `id` musi mieścić się w int32.
      x-required-scope: certificates:read
      responses:
        "200":
          description: Zaświadczenia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentCertificatesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /students/{id}/audit-log:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [students, audit]
      operationId: listStudentAuditLog
      summary: Historia zmian kursanta
      x-required-scope: audit-log:read
      x-requires-admin: true
      responses:
        "200":
          $ref: "#/components/responses/AuditLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --------------------------------------------------------------- companies
  /companies:
    get:
      tags: [companies]
      operationId: listCompanies
      summary: Lista firm
      description: >-
        Sortowanie: nazwa, miasto. `search` dopasowuje fragment (bez rozróżniania wielkości liter)
        w nazwie, mieście, NIP-ie lub osobie kontaktowej.
      x-required-scope: companies:read
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Firmy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [companies]
      operationId: createCompany
      summary: Utworzenie firmy
      x-required-scope: companies:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyWrite"
      responses:
        "201":
          description: Utworzona firma.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Firma o tym NIP-ie już istnieje (`company with this NIP already exists`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /companies/lookup-by-nip:
    get:
      tags: [companies]
      operationId: lookupCompanyByNip
      summary: Pobranie danych firmy z rejestru GUS (BIR)
      description: >-
        Nie zapisuje niczego w bazie — zwraca dane do wstępnego wypełnienia formularza firmy.
        Wywołuje zewnętrzną usługę GUS, więc bywa wolne i może zawieść niezależnie od API.
      x-required-scope: companies:read
      parameters:
        - name: nip
          in: query
          required: true
          description: NIP; myślniki i spacje są usuwane przed walidacją sumy kontrolnej.
          schema:
            type: string
            examples: ["123-456-32-18"]
      responses:
        "200":
          description: Dane firmy z GUS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GusCompanyResponse"
        "400":
          description: >-
            Brak NIP-u (`no nip value in request`) lub błędny NIP
            (`nip validation error: nip must contain exactly 10 digits`,
            `nip validation error: invalid nip checksum`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "GUS nie zna firmy o tym NIP-ie (`company not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: >-
            Integracja z GUS nieskonfigurowana (`gus lookup is not configured`) albo błąd GUS
            (`unable to login to BIR`, `nip lookup failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /companies/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [companies]
      operationId: getCompany
      summary: Szczegóły firmy
      x-required-scope: companies:read
      responses:
        "200":
          description: Firma.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [companies]
      operationId: replaceCompany
      summary: Aktualizacja firmy (pełne nadpisanie)
      description: >-
        **Mimo metody PATCH to pełne nadpisanie.** Pominięte `email`, `contactPerson`, `note`,
        `expiryNotificationEmail` zostaną wyczyszczone, a pominięte `expiryNotificationsEnabled`
        ustawi się na `false`. Zawsze wysyłaj komplet danych.
      x-required-scope: companies:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyWrite"
      responses:
        "200":
          description: Firma po zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "Inna firma ma już ten NIP (`company with this NIP already exists`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /companies/{id}/students:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [companies, students]
      operationId: listCompanyStudents
      summary: Kursanci firmy
      description: >-
        Bez paginacji i limitu, sortowanie: nazwisko, imię. Nieistniejąca firma daje pustą listę, nie 404.
      x-required-scope: students:read
      responses:
        "200":
          description: Kursanci firmy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyStudentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /companies/{id}/certificates:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [companies, certificates]
      operationId: listCompanyCertificates
      summary: Zaświadczenia firmy (z paginacją)
      description: >-
        Jedyne obok `GET /courses/{id}/certificates` miejsce z paginacją stronami.
        Domyślny `limit` to **10**, nie 50.
      x-required-scope: certificates:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Strona zaświadczeń.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificatePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /companies/{id}/audit-log:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [companies, audit]
      operationId: listCompanyAuditLog
      summary: Historia zmian firmy
      x-required-scope: audit-log:read
      x-requires-admin: true
      responses:
        "200":
          $ref: "#/components/responses/AuditLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ----------------------------------------------------------------- courses
  /courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: Lista kursów (bez treści)
      description: >-
        `search` dopasowuje fragment w nazwie głównej, nazwie lub symbolu. Wyniki są rankingowane:
        dokładny symbol, symbol zaczynający się od frazy, nazwa zaczynająca się od frazy, nazwa
        główna zaczynająca się od frazy, symbol zawierający frazę, reszta; w obrębie grupy
        sortowanie po symbolu i nazwie.
      x-required-scope: courses:read
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Kursy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [courses]
      operationId: createCourse
      summary: Utworzenie kursu
      x-required-scope: courses:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseWrite"
      responses:
        "201":
          description: Utworzony kurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Kurs o tym symbolu już istnieje (`failed to create course: symbol exist`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "Także gdy `courseProgram` nie jest poprawnym JSON-em (`failed to create course`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /courses/details:
    get:
      tags: [courses]
      operationId: listCoursesWithContent
      summary: Lista kursów z programem, szablonem i tłumaczeniami
      description: >-
        Te same wyniki i ta sama kolejność co `GET /courses` dla tych samych parametrów, ale każdy
        element zawiera pełną treść kursu. Odpowiedź bywa duża (szablony HTML mają kilka kB na kurs) —
        używaj tylko, gdy treść jest potrzebna.
      x-required-scope: courses:read
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Kursy z treścią.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetailsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [courses]
      operationId: getCourse
      summary: Szczegóły kursu z treścią i tłumaczeniami
      x-required-scope: courses:read
      responses:
        "200":
          description: Kurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [courses]
      operationId: replaceCourse
      summary: Aktualizacja kursu (pełne nadpisanie, łącznie z tłumaczeniami)
      description: >-
        **Mimo metody PATCH to pełne nadpisanie.** Lista `certificateTranslations` jest synchronizowana
        z bazą: tłumaczenia z listy są wstawiane lub nadpisywane, a **każde tłumaczenie, którego nie ma
        na liście, jest usuwane**. Pominięcie pola usuwa wszystkie tłumaczenia kursu. Zmiana kursu nie
        wpływa na wystawione już zaświadczenia (przechowują kopię treści).
      x-required-scope: courses:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseWrite"
      responses:
        "200":
          description: Kurs po zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{id}/certificates:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [courses, certificates]
      operationId: listCourseCertificates
      summary: Zaświadczenia kursu (z paginacją)
      description: Domyślny `limit` to **10**, nie 50.
      x-required-scope: certificates:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Strona zaświadczeń.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificatePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /courses/{id}/audit-log:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [courses, audit]
      operationId: listCourseAuditLog
      summary: Historia zmian kursu
      x-required-scope: audit-log:read
      x-requires-admin: true
      responses:
        "200":
          $ref: "#/components/responses/AuditLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ------------------------------------------------------------ certificates
  /certificates:
    get:
      tags: [certificates]
      operationId: listCertificates
      summary: Lista zaświadczeń
      description: >-
        Sortowanie: data wystawienia malejąco, potem id malejąco. Pomija zaświadczenia usunięte.
        `search` dopasowuje fragment w imieniu, nazwisku, nazwie firmy, nazwie lub symbolu kursu
        oraz w numerze zaświadczenia w formacie `numer/SYMBOL/rok` (np. `12/BHP/2026`).
        `dateFrom`/`dateTo` filtrują po dacie wystawienia (włącznie).
      x-required-scope: certificates:read
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Zaświadczenia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [certificates]
      operationId: createCertificate
      summary: Wystawienie zaświadczenia
      description: >-
        Zaświadczenie zapisuje **kopię** danych kursanta i treści kursu z chwili wystawienia — późniejsze
        zmiany kursanta lub kursu go nie zmieniają.

        Reguły (patrz też INTEGRATION.md, sekcja o zaświadczeniach):
        - `certificateDate` nie może być wcześniejsza niż koniec kursu (`courseDateEnd`, a gdy brak — `courseDateStart`).
        - `courseDateEnd`, jeśli podana, nie może być wcześniejsza niż `courseDateStart`.
        - Numer rejestru musi być wolny w obrębie (kurs, rok) i zachowywać chronologię: data zaświadczenia
          musi mieścić się między datami zaświadczeń o sąsiednich numerach w tym samym kursie i roku.
          Kolejny wolny numer pobierzesz z `GET /registries/next-number`.
        - `languageCode` inny niż `pl` wymaga istniejącego tłumaczenia kursu w tym języku.
      x-required-scope: certificates:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateCreate"
      responses:
        "201":
          description: Wystawione zaświadczenie (tylko id — szczegóły pobierz przez GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          description: >-
            `invalid request body`, `invalid certificate data` (brak/niepoprawne pola, zła kolejność
            dat kursu albo naruszona chronologia rejestru), `certificate date cannot be before course
            end date`, `certificate translation not found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Kursant lub kurs z ciała żądania nie istnieje (`student not found`, `course not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Numer rejestru zajęty (`registry number already taken for the given year`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /certificates/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [certificates]
      operationId: getCertificate
      summary: Szczegóły zaświadczenia z wariantami wydruku
      description: Zaświadczenie usunięte (soft delete) daje 404, tak jak nieistniejące.
      x-required-scope: certificates:read
      responses:
        "200":
          description: Zaświadczenie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [certificates]
      operationId: replaceCertificate
      summary: Korekta zaświadczenia (pełne nadpisanie)
      description: >-
        Pozwala zmienić kursanta i daty. Numer rejestru, kurs i język są niezmienne. Pominięte
        `courseDateEnd` zostanie ustawione na `null`. Zmiana kursanta odświeża kopię jego danych w
        zaświadczeniu. W odpowiedzi `printVariants` zawiera **tylko** wariant oryginalny — pełną listę
        wariantów zwraca GET.
      x-required-scope: certificates:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateUpdate"
      responses:
        "200":
          description: Zaświadczenie po zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateDetailsResponse"
        "400":
          description: "`invalid request body` lub `certificate date cannot be before course end date`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Zaświadczenie nie istnieje (`certificate not found`) albo nie istnieje wskazany kursant (`student not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [certificates]
      operationId: deleteCertificate
      summary: Usunięcie zaświadczenia (soft delete)
      description: >-
        Ciało jest opcjonalne — służy tylko do podania powodu usunięcia.
        Usunięcie jest nieodwracalne przez API: zaświadczenie znika z list, `GET /certificates/{id}` i wydruk
        zwracają odtąd 404, a jego numer rejestru można wykorzystać ponownie.
      x-required-scope: certificates:write
      x-requires-admin: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateDelete"
      responses:
        "200":
          description: Usunięte zaświadczenie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Nie istnieje lub jest już usunięte (`certificate not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /certificates/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [certificates]
      operationId: getCertificatePdf
      summary: Wydruk zaświadczenia (PDF)
      description: >-
        Renderowane na serwerze (wkhtmltopdf/Chromium) — może trwać kilka sekund; limit czasu żądania
        to 60 s. Nagłówek `Content-Disposition` zawiera nazwę pliku `zaswiadczenie-<numer>.pdf`.
      x-required-scope: certificates:read
      parameters:
        - name: language
          in: query
          description: >-
            Język wydruku. Domyślnie język, w którym wystawiono zaświadczenie. `pl` bierze aktualną
            treść kursu; inne kody — aktualne tłumaczenie kursu. Dostępne kody zwraca
            `GET /certificates/{id}` w `printVariants[].languageCode`.
          schema:
            type: string
            examples: ["en"]
      responses:
        "200":
          description: Plik PDF.
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        "400":
          description: "`invalid certificate id` lub brak tłumaczenia (`certificate translation not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /certificates/{id}/audit-log:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [certificates, audit]
      operationId: listCertificateAuditLog
      summary: Historia zmian zaświadczenia
      x-required-scope: audit-log:read
      x-requires-admin: true
      responses:
        "200":
          $ref: "#/components/responses/AuditLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # -------------------------------------------------------------- registries
  /registries/next-number:
    get:
      tags: [registries]
      operationId: getNextRegistryNumber
      summary: Kolejny wolny numer rejestru dla kursu i roku
      description: >-
        Zwraca `max(numer) + 1` wśród nieusuniętych zaświadczeń kursu w danym roku (1, gdy brak).
        To tylko podpowiedź — między odczytem a `POST /certificates` numer może zająć ktoś inny (wtedy 409).
      x-required-scope: registries:read
      parameters:
        - name: courseId
          in: query
