          minLength: 1
        organizerAddress:
          type: [string, "null"]
        location:
          type: string
          minLength: 1
        formOfTraining:
          type: string
          minLength: 1
        legalBasis:
          type: string
          minLength: 1
        dateStart:
          $ref: "#/components/schemas/Date"
        dateEnd:
          $ref: "#/components/schemas/Date"
        notes:
          type: [string, "null"]
    JournalSession:
      type: object
      required: [id, journalId, sessionDate, startTime, endTime, hours, topic, trainerName, sortOrder, createdAt]
      properties:
        id:
          type: integer
          format: int64
        journalId:
          type: integer
          format: int64
        sessionDate:
          $ref: "#/components/schemas/Date"
        startTime:
          type: [string, "null"]
          pattern: "^\\d{2}:\\d{2}:\\d{2}$"
          description: "`HH:MM:SS`. Obecnie API nie pozwala go ustawić — w praktyce `null`."
        endTime:
          type: [string, "null"]
          pattern: "^\\d{2}:\\d{2}:\\d{2}$"
        hours:
          type: string
          description: Liczba godzin jako **string** z liczbą.
        topic:
          type: string
        trainerName:
          type: string
        sortOrder:
          type: integer
        createdAt:
          $ref: "#/components/schemas/LocalTimestamp"
    JournalSessionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JournalSession"
    JournalSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/JournalSession"
    JournalSessionUpdate:
      type: object
      additionalProperties: false
      required: [sessionDate, trainerName]
      properties:
        sessionDate:
          $ref: "#/components/schemas/Date"
        trainerName:
          type: string
          minLength: 1
    GenerateSessionsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [generatedCount]
          properties:
            generatedCount:
              type: integer
    JournalAttendee:
      type: object
      required: [id, journalId, studentId, fullNameSnapshot, birthdateSnapshot, companyNameSnapshot, certificate, sortOrder, createdAt]
      properties:
        id:
          type: integer
          format: int64
          description: Id uczestnika — tego używaj w ścieżkach `/attendees/{attendeeId}` i w obecności.
        journalId:
          type: integer
          format: int64
        studentId:
          type: integer
          format: int64
        fullNameSnapshot:
          type: string
        birthdateSnapshot:
          $ref: "#/components/schemas/Date"
        companyNameSnapshot:
          type: [string, "null"]
        certificate:
          oneOf:
            - type: object
              required: [id, date, registryYear, registryNumber, courseSymbol]
              properties:
                id:
                  type: integer
                  format: int64
                date:
                  $ref: "#/components/schemas/Date"
                registryYear:
                  type: integer
                registryNumber:
                  type: integer
                courseSymbol:
                  type: string
            - type: "null"
        sortOrder:
          type: integer
        createdAt:
          $ref: "#/components/schemas/LocalTimestamp"
    JournalAttendeeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JournalAttendee"
    JournalAttendeeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/JournalAttendee"
    JournalAttendeeAdd:
      type: object
      additionalProperties: false
      required: [studentId]
      properties:
        studentId:
          type: integer
          format: int64
          minimum: 1
    JournalAttendeeCertificateLink:
      type: object
      additionalProperties: false
      required: [certificateId]
      properties:
        certificateId:
          type: [integer, "null"]
          format: int64
          minimum: 1
    JournalAttendance:
      type: object
      required: [id, journalSessionId, journalAttendeeId, present, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        journalSessionId:
          type: integer
          format: int64
        journalAttendeeId:
          type: integer
          format: int64
        present:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/LocalTimestamp"
        updatedAt:
          $ref: "#/components/schemas/LocalTimestamp"
    JournalAttendanceListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/JournalAttendance"
    JournalAttendanceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/JournalAttendance"
    JournalAttendanceUpdate:
      type: object
      additionalProperties: false
      required: [journalSessionId, journalAttendeeId, present]
      properties:
        journalSessionId:
          type: integer
          format: int64
          minimum: 1
        journalAttendeeId:
          type: integer
          format: int64
          minimum: 1
          description: Id uczestnika dziennika, nie kursanta.
        present:
          type: boolean
    JournalScan:
      type: object
      required: [id, fileName, contentType, fileSize, uploadedByUserId, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
        contentType:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        fileSize:
          type: integer
          format: int64
          description: Rozmiar w bajtach.
        uploadedByUserId:
          type: integer
          format: int64
        createdAt:
          $ref: "#/components/schemas/LocalTimestamp"
        updatedAt:
          $ref: "#/components/schemas/LocalTimestamp"
    JournalScanResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/JournalScan"

