            application/json:
              schema:
                $ref: "#/components/schemas/JournalScanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`file not found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ------------------------------------------------------------------- admin
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Lista użytkowników systemu
      x-required-scope: users:read
      x-requires-admin: true
      responses:
        "200":
          description: Użytkownicy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [admin]
      operationId: createUser
      summary: Utworzenie użytkownika
      x-required-scope: users:write
      x-requires-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Utworzony użytkownik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: "`invalid request body` lub `invalid email format`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: "Także przy zajętym adresie e-mail (`failed to create user`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [admin]
      operationId: replaceUser
      summary: Aktualizacja użytkownika (pełne nadpisanie)
      x-required-scope: users:write
      x-requires-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Użytkownik po zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: "`invalid request body` lub `invalid email format`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Brak uprawnień albo naruszenie ochrony administratorów:
            `cannot remove your own last admin access`, `cannot update last admin role`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Usunięcie użytkownika
      description: >-
        Nie można usunąć konta, w imieniu którego działa klucz, ani ostatniego administratora.
        Usunięcie konta serwisowego unieważnia jego klucze API.
      x-required-scope: users:write
      x-requires-admin: true
      responses:
        "200":
          description: Usunięty użytkownik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cannot delete current user`, `cannot delete last admin`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [admin]
      operationId: resetUserPassword
      summary: Ustawienie nowego hasła użytkownikowi
      description: Unieważnia wszystkie sesje przeglądarkowe użytkownika.
      x-required-scope: users:write
      x-requires-admin: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordReset"
      responses:
        "204":
          description: Hasło zmienione.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`cannot reset current user password via admin endpoint`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /admin/users/{id}/audit-log:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [admin, audit]
      operationId: listUserAuditLog
      summary: Historia zmian użytkownika
      x-required-scope: audit-log:read
      x-requires-admin: true
      responses:
        "200":
          $ref: "#/components/responses/AuditLog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        Klucz API w nagłówku `Authorization: Bearer clk_...`. Klucze wystawia administrator w aplikacji
        webowej (Administracja → Klucze API). Klucz działa w imieniu przypisanego konta serwisowego i
        tylko w zakresie nadanych uprawnień (`x-required-scope`).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AttendeeId:
      name: attendeeId
      in: path
      required: true
      description: Id uczestnika dziennika (`JournalAttendee.id`), **nie** id kursanta.
      schema:
        type: integer
        format: int64
        minimum: 1
    Search:
      name: search
      in: query
      description: Fraza wyszukiwania; białe znaki na brzegach są obcinane, pusta = brak filtra.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Maksymalna liczba wyników. Poza zakresem 1–100 → 400 `incorrect limit value`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Page:
      name: page
      in: query
      description: Numer strony, od 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageLimit:
      name: limit
      in: query
      description: Rozmiar strony. Poza zakresem 1–100 → 400 `invalid limit value`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    DateFrom:
      name: dateFrom
      in: query
      description: "Data `YYYY-MM-DD`, włącznie. Nie może być późniejsza niż `dateTo`."
      schema:
        $ref: "#/components/schemas/Date"
    DateTo:
      name: dateTo
      in: query
      description: "Data `YYYY-MM-DD`, włącznie."
      schema:
        $ref: "#/components/schemas/Date"

  requestBodies:
    ScanUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                contentMediaType: application/octet-stream
                description: Plik PDF, JPEG lub PNG, maks. 16 MiB. Nazwa pliku z formularza jest zapisywana.

  responses:
    BadRequest:
      description: >-
        Błędne żądanie — np. `invalid request body` (brak wymaganego pola, pole spoza schematu,
        zła data), błędny identyfikator w ścieżce, `incorrect limit value`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UploadBadRequest:
      description: >-
        `invalid request body` (nie multipart), `file is required`, `file is too large`,
        `unsupported file type`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        Brak lub nieważny klucz: `missing credentials`, `invalid or expired api key`.
        Klucz mógł zostać unieważniony, wygasnąć albo jego konto usunięto.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: >-
        Klucz jest ważny, ale nie ma uprawnień: `api key is missing the <zakres> scope`
        albo `admin access required` (konto serwisowe nie jest administratorem).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Zasób nie istnieje — `<zasób> not found`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Błąd serwera (`internal_error`). Treść komunikatu nie jest stabilna.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScanFile:
      description: Plik skanu w oryginalnym typie; `Content-Disposition` zawiera oryginalną nazwę pliku.
      content:
        application/pdf:
          schema:
            type: string
            contentMediaType: application/pdf
        image/jpeg:
          schema:
            type: string
            contentMediaType: image/jpeg
        image/png:
          schema:
            type: string
            contentMediaType: image/png
    AuditLog:
      description: Wpisy historii zmian, od najnowszych. Nieistniejący obiekt daje pustą listę.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuditLogResponse"

  schemas:
    # ------------------------------------------------------------ primitives
    Date:
      type: string
      format: date
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      examples: ["2026-09-14"]
    LocalTimestamp:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}$"
      description: >-
        Znacznik czasu `YYYY-MM-DD HH:MM:SS` w **lokalnym czasie serwera, bez strefy czasowej**.
        Nie jest to ISO 8601 (spacja zamiast `T`, brak przesunięcia).
      examples: ["2026-09-14 10:30:00"]
    NullableLocalTimestamp:
      oneOf:
        - $ref: "#/components/schemas/LocalTimestamp"
        - type: "null"
    NullableDate:
      oneOf:
        - $ref: "#/components/schemas/Date"
        - type: "null"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, unauthorized, invalid_credentials, forbidden, not_found, conflict, internal_error]
            message:
              type: string
              description: >-
                Komunikat po angielsku. Komunikaty wymienione w opisach operacji są stabilne i można na nich
                opierać logikę; pozostałe traktuj jako informacyjne.
    IdResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          format: int64
          description: Liczba wszystkich pasujących zaświadczeń.
        totalPages:
          type: integer

    # ------------------------------------------------------------------ auth
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    AuthUserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AuthUser"
    Role:
      type: integer
      description: >-
        `1` = administrator. **Każda inna wartość** (w danych występują `0` i `2`) to zwykły użytkownik —
        sprawdzaj `role === 1`, nie zakładaj konkretnej wartości dla zwykłego konta.
      examples: [1, 2, 0]
    RoleInput:
      type: integer
      minimum: 1
      description: "`1` = administrator. Przy zapisie wymagana wartość dodatnia; aplikacja webowa dla zwykłego użytkownika używa `2`."
      examples: [1, 2]

    # -------------------------------------------------------------- students
    CompanyRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    StudentListItem:
      type: object
      required: [id, firstName, lastName, pesel, birthDate, company]
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        pesel:
          type: [string, "null"]
        birthDate:
          $ref: "#/components/schemas/Date"
        company:
