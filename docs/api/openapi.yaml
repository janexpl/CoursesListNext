        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`file not found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [journals]
      operationId: uploadSignedScan
      summary: Wgranie (lub zastąpienie) skanu podpisanego dziennika
      description: Te same reguły co dla skanu listy obecności.
      x-required-scope: journals:write
      requestBody:
        $ref: "#/components/requestBodies/ScanUpload"
      responses:
        "200":
          description: Metadane wgranego pliku.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalScanResponse"
        "400":
          $ref: "#/components/responses/UploadBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [journals]
