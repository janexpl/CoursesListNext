      summary: Wystawienie zaświadczenia uczestnikowi na podstawie dziennika
      description: >-
        Numer rejestru i data są dobierane automatycznie: rok = rok `dateEnd` dziennika, numer = ostatni
        numer w tym kursie i roku + 1, data = `dateEnd` dziennika (lub data ostatniego zaświadczenia,
        jeśli jest późniejsza). Zaświadczenie zostaje od razu powiązane z uczestnikiem.
      x-required-scope: journals:write
      responses:
        "201":
          description: Id wystawionego zaświadczenia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`journal attendee not found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`certificate already linked to journal attendee`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /journals/{id}/attendees/{attendeeId}/certificate:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/AttendeeId"
    patch:
      tags: [journals, certificates]
      operationId: linkAttendeeCertificate
      summary: Powiązanie istniejącego zaświadczenia z uczestnikiem (lub odpięcie)
      description: >-
        `certificateId: null` odpina zaświadczenie. Zaświadczenie musi należeć do tego samego kursanta,
        dotyczyć kursu dziennika i nie być usunięte; jedno zaświadczenie może być powiązane z najwyżej
        jednym uczestnikiem.
      x-required-scope: journals:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalAttendeeCertificateLink"
      responses:
        "200":
          description: Uczestnik po zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalAttendeeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `journal attendee or certificate not found` — także gdy zaświadczenie nie spełnia warunków
            (inny kursant, inny kurs, usunięte).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`certificate already linked to another journal attendee`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /journals/{id}/attendance:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [journals]
      operationId: listJournalAttendance
      summary: Obecność na sesjach
      description: >-
        Zawiera tylko zapisane wpisy. Brak wpisu dla pary (sesja, uczestnik) oznacza, że obecności
        jeszcze nie zaznaczano.
      x-required-scope: journals:read
      responses:
        "200":
          description: Wpisy obecności.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalAttendanceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [journals]
      operationId: setJournalAttendance
      summary: Zaznaczenie obecności jednego uczestnika na jednej sesji
      description: Upsert — tworzy lub nadpisuje wpis dla pary (sesja, uczestnik).
      x-required-scope: journals:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalAttendanceUpdate"
      responses:
        "200":
          description: Wpis obecności.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalAttendanceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            `journal not found` albo sesja lub uczestnik nie należą do dziennika
            (`journal attendance not found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`journal is closed`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /journals/{id}/attendance-scan:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [journals]
      operationId: downloadAttendanceScan
      summary: Pobranie skanu listy obecności
      x-required-scope: journals:read
      responses:
        "200":
          $ref: "#/components/responses/ScanFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`file not found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [journals]
      operationId: uploadAttendanceScan
      summary: Wgranie (lub zastąpienie) skanu listy obecności
      description: >-
        `multipart/form-data` z polem `file`. Maks. 16 MiB. Typ jest wykrywany z zawartości pliku
        (nie z rozszerzenia ani nagłówka): dozwolone PDF, JPEG, PNG. Działa także na zamkniętym dzienniku.
      x-required-scope: journals:write
      requestBody:
        $ref: "#/components/requestBodies/ScanUpload"
      responses:
        "200":
          description: Metadane wgranego pliku.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalScanResponse"
        "400":
          $ref: "#/components/responses/UploadBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [journals]
      operationId: deleteAttendanceScan
      summary: Usunięcie skanu listy obecności
      x-required-scope: journals:write
      responses:
        "204":
          description: Usunięto.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`file not found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /journals/{id}/attendance-scan/meta:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [journals]
      operationId: getAttendanceScanMeta
      summary: Metadane skanu listy obecności
      description: 404 oznacza, że skanu jeszcze nie wgrano.
      x-required-scope: journals:read
      responses:
        "200":
          description: Metadane.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalScanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`file not found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /journals/{id}/signed-scan:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
