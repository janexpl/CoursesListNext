    # --------------------------------------------------------------- courses
    CourseListItem:
      type: object
      required: [id, mainName, name, symbol, expiryTime]
      properties:
        id:
          type: integer
          format: int64
        mainName:
          type: string
        name:
          type: string
        symbol:
          type: string
          description: Unikalny symbol kursu, używany w numerze zaświadczenia.
        expiryTime:
          $ref: "#/components/schemas/ExpiryTime"
    CourseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CourseListItem"
    ExpiryTime:
      type: [integer, "null"]
      minimum: 0
      description: >-
        Okres ważności zaświadczenia w **latach**. `null` = kurs bez terminu ważności; `0` to poprawna wartość
        (ważność kończy się z końcem kursu). Data wygaśnięcia = `courseDateEnd` + `expiryTime` × 365 dni.
      examples: [5]
    CourseProgram:
      type: string
      contentMediaType: application/json
      description: >-
        **String zawierający JSON** (nie zagnieżdżony obiekt) — tablicę pozycji programu:
        `[{"Subject": "Temat", "TheoryTime": "4", "PracticeTime": "0"}]`. Klucze wielką literą,
        godziny jako stringi z liczbą. Program jest źródłem sesji dziennika i tabeli na wydruku.
      examples:
        - '[{"Subject":"Przepisy BHP","TheoryTime":"4","PracticeTime":"0"}]'
    CertFrontPage:
      type: string
      description: >-
        Szablon HTML pierwszej strony zaświadczenia. Placeholdery w podwójnych nawiasach klamrowych
        (spacje wewnątrz dowolne): `{{ imie }}`, `{{ drugie_imie }}`, `{{ nazwisko }}`, `{{ pesel }}`,
        `{{ data_urodzenia }}`, `{{ miejsce_urodzenia }}`, `{{ nazwa_kursu }}`, `{{ data_rozpoczecia }}`,
        `{{ data_zakonczenia }}`, `{{ data_wystawienia }}`, `{{ numer_zaswiadczenia }}`.
        Wartości są wstawiane z escapowaniem HTML, daty w formacie polskim.
    CourseCertificateTranslation:
      type: object
      required: [languageCode, courseName, courseProgram, certFrontPage]
      properties:
        languageCode:
          $ref: "#/components/schemas/TranslationLanguageCode"
        courseName:
          type: string
          minLength: 1
        courseProgram:
          $ref: "#/components/schemas/CourseProgram"
        certFrontPage:
          $ref: "#/components/schemas/CertFrontPage"
    TranslationLanguageCode:
      type: string
      enum: [en, de, uk, cs, sk, lt]
      description: "Języki tłumaczeń. `pl` to język bazowy kursu i nie może być tłumaczeniem."
    CourseDetails:
      type: object
      required: [id, mainName, name, symbol, expiryTime, courseProgram, certFrontPage, certificateTranslations]
      properties:
        id:
          type: integer
          format: int64
        mainName:
          type: string
        name:
          type: string
        symbol:
          type: string
        expiryTime:
          $ref: "#/components/schemas/ExpiryTime"
        courseProgram:
          $ref: "#/components/schemas/CourseProgram"
        certFrontPage:
          $ref: "#/components/schemas/CertFrontPage"
        certificateTranslations:
          type: array
          description: Posortowane po kodzie języka; pusta tablica, gdy brak tłumaczeń.
          items:
            $ref: "#/components/schemas/CourseCertificateTranslation"
    CourseDetailsResponse:
      type: object
      required: [data]
      properties:
