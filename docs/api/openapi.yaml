      properties:
        mainName:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        expiryTime:
          type: integer
          minimum: 0
          description: Wymagane (nie może być `null`). Nieujemna liczba całkowita lat.
          examples: [5]
        courseProgram:
          $ref: "#/components/schemas/CourseProgram"
        certFrontPage:
          $ref: "#/components/schemas/CertFrontPage"
        certificateTranslations:
          type: array
          description: >-
            **Pełna lista** tłumaczeń — przy PATCH tłumaczenia spoza listy są usuwane. Kody języków nie mogą się
            powtarzać; wszystkie pola każdego tłumaczenia są wymagane.
