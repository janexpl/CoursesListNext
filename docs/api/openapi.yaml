    # ----------------------------------------------------------------- audit
    AuditLogEntry:
      type: object
      required: [id, entityType, entityId, action, actorUserId, actorUserEmail, actorUserName, requestId, before, after, metadata, createdAt]
      properties:
        id:
          type: integer
          format: int64
        entityType:
          type: string
          enum: [course, certificate, company, student, user]
        entityId:
          type: integer
          format: int64
        action:
          type: string
          enum: [create, update, delete]
        actorUserId:
          type: [integer, "null"]
          format: int64
          description: Konto, które wykonało zmianę — dla zmian z klucza API to jego konto serwisowe.
        actorUserEmail:
          type: [string, "null"]
        actorUserName:
          type: [string, "null"]
        requestId:
          type: [string, "null"]
        before:
          description: Stan przed zmianą (dowolny JSON) lub `null`.
        after:
          description: Stan po zmianie (dowolny JSON) lub `null`.
        metadata:
          description: Dodatkowe informacje (dowolny JSON) lub `null`.
        createdAt:
          $ref: "#/components/schemas/LocalTimestamp"
    AuditLogResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
