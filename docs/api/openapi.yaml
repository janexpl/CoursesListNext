        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/RoleInput"
    AdminUserUpdate:
      type: object
      additionalProperties: false
      required: [email, firstName, lastName, role]
