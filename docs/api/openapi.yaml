              schema:
                $ref: "#/components/schemas/Error"

  /journals/{id}/signed-scan/meta:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [journals]
      operationId: getSignedScanMeta
      summary: Metadane skanu podpisanego dziennika
      x-required-scope: journals:read
      responses:
        "200":
          description: Metadane.
