  # ---------------------------------------------------------------- journals
  /journals:
    get:
      tags: [journals]
      operationId: listJournals
      summary: Lista dzienników szkoleń
      description: >-
        Sortowanie: data utworzenia malejąco. `search` dopasowuje fragment w tytule, symbolu i nazwie
        kursu, nazwie firmy, miejscu i organizatorze. `dateFrom` filtruje po `dateStart >= dateFrom`,
        `dateTo` po `dateEnd <= dateTo`.
      x-required-scope: journals:read
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Limit"
        - name: courseId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: companyId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JournalStatus"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Dzienniki.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [journals]
      operationId: createJournal
      summary: Utworzenie dziennika
      description: >-
        Tworzy dziennik w statusie `draft` i **od razu generuje sesje z programu kursu** (maks. 8 godzin
        na dzień, kolejne dni od `dateStart`, prowadzący = `organizerName`); `sessionsCount` w odpowiedzi
        podaje ich liczbę. `totalHours` jest liczone z programu kursu.
      x-required-scope: journals:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCreate"
      responses:
        "201":
          description: Utworzony dziennik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDetailsResponse"
        "400":
          description: "`invalid request body`, `invalid dateStart`, `invalid dateEnd`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "Kurs nie istnieje (`course not found`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /journals/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [journals]
      operationId: getJournal
      summary: Szczegóły dziennika
      x-required-scope: journals:read
      responses:
        "200":
          description: Dziennik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [journals]
      operationId: replaceJournalHeader
      summary: Aktualizacja nagłówka dziennika (pełne nadpisanie)
      description: >-
        Kursu nie da się zmienić. Pominięte `companyId`, `organizerAddress`, `notes` zostaną wyczyszczone.
        Nowy zakres dat musi obejmować daty wszystkich istniejących sesji.
      x-required-scope: journals:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalUpdate"
      responses:
        "200":
          description: Dziennik po zmianie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalDetailsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Dziennik zamknięty (`unable to change header because journal is closed`) albo sesja poza
            nowym zakresem dat (`session outside range`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [journals]
      operationId: deleteJournal
      summary: Usunięcie dziennika
      description: >-
        Trwałe usunięcie wraz z sesjami, uczestnikami, obecnością i skanami. Działa także na dziennikach
        zamkniętych. Wystawione zaświadczenia pozostają.
      x-required-scope: journals:write
      responses:
        "200":
          description: Usunięty dziennik.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /journals/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
