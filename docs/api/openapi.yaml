      operationId: getJournalPdf
      summary: Wydruk dziennika (PDF)
      x-required-scope: journals:read
      responses:
        "200":
          description: Plik PDF.
          content:
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /journals/{id}/close:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [journals]
      operationId: closeJournal
      summary: Zamknięcie dziennika
      description: >-
        Nieodwracalne przez API. Wymaga co najmniej jednego uczestnika i jednej sesji. Zamknięty
