          schema:
            type: integer
            format: int64
            minimum: 1
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            examples: [2026]
      responses:
        "200":
          description: Numer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistryNextNumberResponse"
        "400":
          description: "`invalid course id` lub `invalid year`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # --------------------------------------------------------------- dashboard
  /dashboard:
    get:
      tags: [dashboard]
