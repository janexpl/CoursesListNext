services:
  api:
    #build: ./api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ghcr.io/janexpl/courseslistnext-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-8082}:8082"
    env_file: .env 
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "http://localhost:8082/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/janexpl/courseslistnext-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NUXT_API_TARGET=http://api:8082
    depends_on:
      api:
        condition: service_healthy

  notifications:
    image: ghcr.io/janexpl/courseslistnext-notifications:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NOTIFICATIONS_API_BASE_URL=http://api:8082
      - NOTIFICATIONS_API_TOKEN=${NOTIFICATIONS_API_TOKEN}
      - NOTIFICATIONS_LOOKAHEAD_DAYS=${NOTIFICATIONS_LOOKAHEAD_DAYS:-30}
      - NOTIFICATIONS_LIMIT=${NOTIFICATIONS_LIMIT:-500}
      - NOTIFICATIONS_STATE_FILE=/data/notifications-state.json
      - NOTIFICATIONS_RUN_INTERVAL=${NOTIFICATIONS_RUN_INTERVAL:-24h}
      - NOTIFICATIONS_DRY_RUN=${NOTIFICATIONS_DRY_RUN:-true}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Powiadomienia BHP}
      - SMTP_TLS_MODE=${SMTP_TLS_MODE:-auto}
    volumes:
      - notifications-data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  notifications-data:
